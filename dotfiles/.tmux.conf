##### Prefix #####
unbind C-b
set -g prefix C-j
bind C-j send-prefix

set -s escape-time 10
set -g mouse on
set -g mode-keys vi
set -g focus-events on
set -g history-limit 50000


##### Terminal / Colors #####
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB,ghostty:RGB"
set -s extended-keys on
set -as terminal-features ",xterm-ghostty:extkeys"
set -g set-clipboard on


##### Window & Pane Indexing #####
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on


##### Statusline #####
set -g status-style "bg=default,fg=brightblack"
set -g status-left  " #[bold]#S "
set -g status-right "#(hostname -s) | %Y-%m-%d %R "
set -g window-status-style         "fg=#6c7086,bg=default"
set -g window-status-current-style "fg=#cdd6f4,bg=default,bold"


##### Pane Navigation (Vim-style) #####
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

##### Pane Resizing (repeatable) #####
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


##### Pane ↔ Window #####
bind ! break-pane
bind @ join-pane -h -s !


##### Window Navigation #####
bind -r n select-window -t :+
bind -r p select-window -t :-

##### Window Reordering #####
bind -r < swap-window -t -1\; select-window -t -1
bind -r > swap-window -t +1\; select-window -t +1


##### Copy Mode / Clipboard #####
bind Escape copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"


##### Default Directory #####
set -g default-command "zsh"


##### Misc #####
bind r source-file ~/.tmux.conf \; display-message "tmux: reloaded"
set -g allow-rename off
setw -g automatic-rename off
set -g exit-empty on

# Allow OSC 8 hyperlinks to pass through
set -ga terminal-features "*:hyperlinks"


##### Plugins (TPM) #####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Auto-save every 1 minute, auto-restore on tmux start
set -g @continuum-save-interval '1'
set -g @continuum-restore 'on'

# Restore pane contents
set -g @resurrect-capture-pane-contents 'on'

run "$(brew --prefix)/opt/tpm/share/tpm/tpm"
