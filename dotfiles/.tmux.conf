##### Prefix #####
unbind C-b
set -g prefix C-j
bind C-j send-prefix

set -s escape-time 10
set -g mouse on
set -g mode-keys vi
set -g focus-events on
set -g history-limit 50000


##### Terminal / Colors #####
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB,ghostty:RGB"
set -s extended-keys on
set -as terminal-features ",xterm-ghostty:extkeys"
set -g set-clipboard on


##### Window & Pane Indexing #####
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on


##### Statusline #####
# Catppuccin Mocha palette throughout EXCEPT inactive window/border, which use a
# hue-NEUTRAL gray (#787878 / #9a9a9a). Mocha's overlay1/subtext0 carry a
# lavender cast that reads purple next to the saturated active cyan; pure grays
# stay visually quiet. Do not "fix" back to palette tokens without revisiting.
set -g status-style              "bg=default,fg=#6c7086"           # overlay0
set -g status-left               "#[fg=#cdd6f4,bold] #S "          # text
set -g status-right              "#[fg=#6c7086]#(hostname -s) | %Y-%m-%d %R " # overlay0
set -g window-status-style       "fg=#9a9a9a,bg=default"           # neutral gray
set -g window-status-current-style "fg=#cdd6f4,bg=default,bold"    # text
set -g message-style             "bg=#313244,fg=#cdd6f4"           # surface0 / text
set -g mode-style                "bg=#45475a,fg=#cdd6f4"           # surface1 / text (copy mode)


##### Pane Titles #####
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[bg=#89dceb fg=#1e1e2e bold],#[bg=#45475a fg=#bac2de]} #{?@pane_label,#{@pane_label},#{pane_title}} #[default]"
set -g pane-border-style        "fg=#787878"                       # neutral gray
set -g pane-active-border-style "fg=#89dceb"                       # sky
bind . command-prompt -p "Pane label:" "set-option -p @pane_label '%%'"
bind e display-popup -E -h 40% -w 50% 'tmux list-panes -F "#{pane_index}: #{?@pane_label,#{@pane_label},#{pane_title}}" | fzf --reverse | cut -d: -f1 | xargs -I{} sh -c "tmux select-pane -t .{} && tmux resize-pane -Z"'


##### Pane Navigation (Vim-style) #####
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

##### Pane Resizing (repeatable) #####
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


##### Pane Splits (inherit cwd) #####
bind '"' split-window -v -c "#{pane_current_path}" \; select-pane -T "—"
bind %   split-window -h -c "#{pane_current_path}" \; select-pane -T "—"
bind c   new-window      -c "#{pane_current_path}"


##### Pane ↔ Window #####
bind ! break-pane
bind @ join-pane -h -s !
bind | select-layout even-horizontal
bind _ select-layout even-vertical


##### Window Navigation #####
bind -r n select-window -t :+
bind -r p select-window -t :-

##### Window Reordering #####
bind -r < swap-window -t -1\; select-window -t -1
bind -r > swap-window -t +1\; select-window -t +1


##### Copy Mode / Clipboard #####
bind Escape copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"


##### Default Directory #####
set -g default-command "zsh"


##### Clear Screen + Scrollback #####
bind C send-keys C-l \; clear-history

##### Misc #####
bind r source-file ~/.tmux.conf \; display-message "tmux: reloaded"
set-hook -g pane-focus-in 'refresh-client'
set -g allow-rename off
setw -g automatic-rename off
set -g exit-empty on

# Allow OSC 8 hyperlinks to pass through
set -ga terminal-features "*:hyperlinks"


##### Plugins (TPM) #####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Auto-save every 1 minute, auto-restore on tmux start
set -g @continuum-save-interval '1'
set -g @continuum-restore 'on'

# Restore pane contents
set -g @resurrect-capture-pane-contents 'on'

run "$(brew --prefix)/opt/tpm/share/tpm/tpm"
