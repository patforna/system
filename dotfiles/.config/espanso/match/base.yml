  - trigger: ":cfa"
    replace: "Proceed with full-autonomy. Don't stop or ask questions until done."

  - trigger: ":cdhandoff"
    replace: |-
      Lock in the recommended exploration and write the eng handoff.

      - One final design — resolve every open question, no alternatives left standing.
      - Full state matrix: rest/hover/focus/active/disabled, light + dark, and any coexistence cases.
      - Handoff says only what changes — no rationale, history, trail, or anything Code can infer from its repo + this project.
      - Compliant with the system's principles + tokens; reference is the pixel target.
      - Flag any new/changed token as a DS change (sync first); pure restyles as frontend-only.

  - trigger: ":cdwrapup"
    replace: |-
      Wrap up this Claude Design session — leave the project consistent, nothing settled left in flight.

      - Log every decision reached this session in design-decisions.md.
      - Sync every change back — additions included — everywhere it lives: tokens, specimens (preview/*, style-guide, iconography), README/Component vocabulary, SKILL.md, CLAUDE.md, CLAUDE-CODE.md. New/changed foundation or primitive → style-guide + preview card; new recurring component → Component-vocabulary entry. No drift.
      - Archive finished explorations + closed handoffs; delete decided briefs.
      - @dsCard on foundations only — strip strays.
      - Terse recap: changed / archived / still open.

  - trigger: ":whh"
    replace: "what's happening here?"

  - trigger: ":chm"
    replace: "0796850829"

  - trigger: ":chmi"
    replace: "+41796850829"
