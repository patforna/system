##### Prefix #####
unbind C-b
set -g prefix C-j
bind C-j send-prefix

set -s escape-time 10
set -g mouse on
set -g mode-keys vi
set -g focus-events on
set -g history-limit 50000


##### Terminal / Colors #####
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB,ghostty:RGB"
set -s extended-keys on
set -as terminal-features ",xterm-ghostty:extkeys"
set -g set-clipboard on


##### Window & Pane Indexing #####
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on


##### Statusline #####
set -g status-style "bg=default,fg=brightblack"
set -g status-left  " #[bold]#S "
set -g status-right "#(hostname -s) | %Y-%m-%d %R "
set -g window-status-style         "fg=#6c7086,bg=default"
set -g window-status-current-style "fg=#cdd6f4,bg=default,bold"


##### Pane Titles #####
set -g pane-border-status top
set -g pane-border-format " #{?@pane_label,#{@pane_label},─} "
bind . command-prompt -p "Pane label:" "set-option -p @pane_label '%%'"
bind e display-popup -E -h 40% -w 50% 'tmux list-panes -F "#{pane_index}: #{?@pane_label,#{@pane_label},-}" | fzf --reverse | cut -d: -f1 | xargs -I{} tmux select-pane -t .{}'


##### Pane Navigation (Vim-style) #####
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

##### Pane Resizing (repeatable) #####
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


##### Pane ↔ Window #####
bind ! break-pane
bind @ join-pane -h -s !
bind | select-layout even-horizontal
bind _ select-layout even-vertical


##### Window Navigation #####
bind -r n select-window -t :+
bind -r p select-window -t :-



##### Copy Mode #####
# Clipboard syncs to your local terminal via OSC 52 (Ghostty, iTerm2, etc.)
bind Escape copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel


##### Misc #####
bind r source-file ~/.tmux.conf \; display-message "tmux: reloaded"
set -g allow-rename off
setw -g automatic-rename off
set -g exit-empty on

set -ga terminal-features "*:hyperlinks"


##### Plugins (TPM) #####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-save-interval '1'
set -g @continuum-restore 'on'

# Restore pane contents
set -g @resurrect-capture-pane-contents 'on'

run '~/.tmux/plugins/tpm/tpm'

##### Window Reordering (after TPM so bindings aren't overridden) #####
bind -r < swap-window -t -1\; select-window -t -1
bind -r > swap-window -t +1\; select-window -t +1
