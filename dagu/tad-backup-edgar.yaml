# Roughly weekly — cadence lives in scripts/dagu-jobs.conf; no cron schedule here (see
# scripts/dagu-reconcile). The EDGAR cache churns slowly and is ~28GB, so weekly is enough.
# It runs directly after tad-backup-data in the reconciler's serial pass, so the two can
# never hold restic's exclusive repo lock at once (concurrent forget --prune would
# collide) — enforced by construction now, not by a stagger. Runbook: docs/backup-runbook.md.

steps:
  - name: tad-backup-edgar
    # brew shellenv puts restic (/opt/homebrew/bin) on PATH; the script sources
    # secrets and exits 0 (logged) while backups are unconfigured. Network readiness is
    # the reconciler's job, not the script's. Failure handler inherited from base.yaml —
    # no bespoke alerting; a real failure exits non-zero and it stays overdue.
    command: bash -c 'eval "$(/opt/homebrew/bin/brew shellenv)" && "${HOME}/github/tad/scripts/backup.sh" edgar'
