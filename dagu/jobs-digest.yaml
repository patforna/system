# Roughly twice weekly — cadence lives in scripts/dagu-jobs.conf; no cron schedule here
# (see scripts/dagu-reconcile). It summarises the trailing window, so the weekday it
# arrives on carries no meaning. The mail window in scripts/jobs-digest.sh (--days) must
# stay matched to the cadence: dedup is within-run only, so an over-long window re-sends
# the same roles.

# Bound the run defensively — a healthy run is minutes; this caps a hung
# claude render. Genuine failures fall through to the inherited
# handler_on.failure (dagu-autofix.sh) like every other DAG.
timeout_sec: 5400

steps:
  - name: jobs-digest
    command: bash "${HOME}/github/system/scripts/jobs-digest.sh"
