# Roughly weekly — cadence lives in scripts/dagu-jobs.conf; no cron schedule here (see
# scripts/dagu-reconcile). May now land on a weekday rather than Saturday; it summarises
# the trailing window, so the weekday it arrives on carries no meaning.

# Bound the run defensively — a healthy run is minutes; this caps a hung
# claude render. Genuine failures fall through to the inherited
# handler_on.failure (dagu-autofix.sh) like every other DAG.
timeout_sec: 5400

steps:
  - name: jobs-digest
    command: bash "${HOME}/github/system/scripts/jobs-digest.sh"
