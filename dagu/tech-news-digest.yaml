schedule: "0 3 * * 6"

# Bound the run defensively — a healthy run is ~5 min; this caps a hung
# claude render. Genuine failures fall through to the inherited
# handler_on.failure (dagu-autofix.sh) like every other DAG.
timeout_sec: 5400

steps:
  - name: tech-news-digest
    command: bash "${HOME}/github/system/scripts/tech-news-digest.sh"
