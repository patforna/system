# Roughly daily — cadence lives in scripts/dagu-jobs.conf; no cron schedule here (see
# scripts/dagu-reconcile). It no longer pins a weekday: the loaders resume from the last
# persisted date, so a run on a non-trading day simply finds no new bars, and a run after
# a multi-day gap backfills it. Cadence, not calendar. See private/GOTCHAS.md.

steps:
  - name: tad-pipeline
    # No network preflight and no retry_policy. Both used to live here and both were
    # actively harmful: the preflight slept up to 10 min in-process (meaningless across a
    # suspend) and the retry slept 2×300s more. The reconciler now guarantees the machine
    # is awake and online BEFORE this is started, and retries by leaving the job overdue.
    command: bash -c 'eval "$(/opt/homebrew/bin/brew shellenv)" && cd "${HOME}/github/tad/backend" && uv run tad pipeline run -v'
