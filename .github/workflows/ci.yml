name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # private/ stays git-crypt encrypted here; the checks skip it
      - uses: actions/checkout@v5

      - uses: extractions/setup-just@v3

      - name: Install shellcheck and actionlint
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          mkdir -p "$HOME/.local/bin"
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # same entry point as local development - see justfile
      - run: just check
