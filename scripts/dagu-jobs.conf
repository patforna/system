# Freshness SLOs for the dagu jobs, in whole hours ("20") or whole minutes ("4m"). Single source of truth: the
# reconciler (scripts/dagu-reconcile) uses these to decide what is overdue, and
# the digest (scripts/dagu-digest.sh) uses them to decide what is stale.
#
# There are no cron schedules any more. A job is not "due at 03:00"; it is
# "allowed to be at most N hours stale". The reconciler runs whatever is overdue
# whenever the Mac is actually awake AND online. See private/GOTCHAS.md.
#
# LANE (optional third column): a job with a lane runs in its own pass, driven by its own
# launchd agent (`dagu-reconcile <lane>`), concurrently with the main pass. No lane = main.
#   - fast: coach-inbox, then plant-inbox. coach-inbox reads Story Coach rehearsal takes (one
#     claude call each, ~3 min; idle = one HTTP call) and goes first so a long plant write-up
#     can't hold a read for up to 50 min; it reads at most 3 takes a run, so plant waits little.
#     4m for the same reason as plant (every tick). Set 2026-10-06 (Story Coach Phase 1a).
#   - fast: plant-inbox. The family is waiting on its answers, so it must not queue behind
#     the long jobs (it did, for an hour, on 2026-09-26). An idle check is one HTTP call.
#     4m with the 5-minute tick means every tick (a marker stamped at the end of one tick is
#     under 5m old at the next, so 5m would mean every other tick). Set 2026-09-24 for about
#     a week while the family is actively asking; back to 1 (hour) after that — the garden
#     app's copy says how often it checks. An idle run still records a dagu run, so expect
#     ~288 plant-inbox runs a day meanwhile. Agent: com.patric.dagu-reconcile-fast.
#
# ORDER MATTERS — within a lane, jobs run serially, top to bottom. Consequences:
#   - msgvault-sync first: nothing depends on it, but it's quick and self-contained.
#   - tad-pipeline before the backups, so a backup captures the data the pipeline
#     just produced (this is the "chaining" benefit, for free, without an event bus).
#   - the two backups adjacent and serial: restic takes an exclusive repo lock, so
#     they must never overlap. Serial execution makes that impossible by construction
#     (the old design relied on a 1h stagger, which a sleeping laptop voided).
#   - workflow-digest LAST, so the digest it emails reflects everything above it in
#     this same pass rather than the previous pass's outcomes.
#
# 20h (not 24h) for the daily jobs: a 24h SLO plus a 5-minute tick means a job that
# ran at 09:00 isn't due until 09:00 next day, so it drifts later and later and
# eventually skips a day. 20h lets the cadence settle wherever the Mac is reliably on.
#
# job                    slo    lane
msgvault-sync            20
coach-inbox              4m     fast
plant-inbox              4m     fast
tad-pipeline             20
tad-backup-data          20
tad-backup-edgar         156
drift-check              156
tad-daily-code-review    20
droplet-watchdog         4
jobs-digest              78
tech-news-digest         156
workflow-digest          20
