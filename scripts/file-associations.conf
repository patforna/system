# Default file associations (macOS).
# Applied by bootstrap.sh, checked by drift-check.
# Format: extension bundle-id
#
# UTI-based defaults (public.plain-text, public.text, public.source-code)
# are set separately in bootstrap.sh. This file covers specific extensions
# that other apps tend to claim (e.g. Calibre grabs .md, Excel grabs .csv).

.md   com.uranusjr.macdown
.txt  com.microsoft.VSCode
.json com.microsoft.VSCode
.yaml com.microsoft.VSCode
.yml  com.microsoft.VSCode
.xml  com.microsoft.VSCode
.csv  com.microsoft.VSCode
.log  com.microsoft.VSCode
.cfg  com.microsoft.VSCode
.ini  com.microsoft.VSCode
.mp4  org.videolan.vlc
